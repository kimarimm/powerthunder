services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: powerthunder:latest
    container_name: powerthunder
    restart: unless-stopped
    # SECRET_KEY (and any other override) is read from a .env file that
    # lives only on the deploy host — never committed. See .env.example.
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      RELOAD: "false"
      DATABASE_URL: sqlite+aiosqlite:////data/file_storage.db
      STORAGE_ROOT: /data/uploads
    ports:
      - "8082:8080"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3).status < 500 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  data:
